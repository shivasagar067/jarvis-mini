name: Build Jarvis Mini APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Jarvis project
        run: |
          unzip -o JarvisMiniProject.zip -d jarvis

      - name: Configure Android project
        run: |
          sed -i 's/id("com.android.application") version "9.3.0"/id("com.android.application") version "9.2.0"/' jarvis/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' jarvis/app/build.gradle.kts
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Build APK
        working-directory: jarvis
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mini-apk
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
